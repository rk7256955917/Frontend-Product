<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mm.css">
    <title>Frontend Product website</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2><i class="fa-solid fa-chart-pie"></i> Dashboard</h2>

        <p><i class="fa-solid fa-house"></i> Dashboard</p>

        <p><i class="fa-solid fa-user"></i> Users</p>

        <p><i class="fa-solid fa-box"></i> Products</p>

        <p><i class="fa-solid fa-cart-shopping"></i> Orders</p>

        <p><i class="fa-solid fa-message"></i> Messages</p>

        <p><i class="fa-solid fa-gear"></i> Settings</p>

        <h3><i class="fa-solid fa-right-from-bracket"></i> Logout</h3>
      </div>

      <div class="main">
        <div class="search">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" placeholder="Search anything..." />
          </div>

          <div class="icons">
            <i class="fa-solid fa-moon"></i>

            <i class="fa-solid fa-user"></i>
          </div>
        </div>
        <div class="card">
          <div class="card1">
            <h4>Total Users</h4>
            <h2>2,458</h2>
            <p class="rate">
            <i class="fa-solid fa-arrow-up"></i> 12.5%
            </p>
          </div>

            <div class="card1">
            <h4>Total Orders</h4>
            <h2>12,45</h2>
            <p class="rate">
            <i class="fa-solid fa-arrow-up"></i> 8.2%
            </p>
          </div>

          <div class="card1">
            <h4>Total Revenue</h4>
            <h2>$48,920</h2>
            <p class="rate">
            <i class="fa-solid fa-arrow-up"></i> 15.6%
            </p>
          </div>

            <div class="card1">
            <h4>New Messages</h4>
            <h2>328</h2>
            <p class="rate">
            <i class="fa-solid fa-arrow-up"></i> 5.1%
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
